# Database connection (values come from Docker environment variables, with defaults for local use)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${DB_USER:library}
spring.datasource.password=${DB_PASSWORD:library}
# Hibernate creates / updates the tables automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# File upload (book covers and profile photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:uploads}
# Show readable error messages to the front end
server.error.include-message=always
server.port=${PORT:8080}
