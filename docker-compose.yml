# Two containers: the Java web app and the PostgreSQL database.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - dbdata:/var/lib/postgresql/data      # keeps the data when the container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"                          # open http://localhost:8080
    environment:
      DB_URL: jdbc:postgresql://db:5432/library
      DB_USER: library
      DB_PASSWORD: library
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads                # keeps uploaded cover images
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  uploads:
